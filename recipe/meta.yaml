{% set name = "anybadge" %}
{% set version = "1.18.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/anybadge-{{ version }}.tar.gz
  sha256: 1f275a1aa14a8d04d1043b420550504eb72d44d222fea78e2a6a0347f8a2e6e3

build:
  entry_points:
    - anybadge=anybadge.cli:main
    - anybadge-server=anybadge.server.cli:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
    - wheel

  run:
    - packaging
    - python >={{ python_min }}

test:
  imports:
    - anybadge
    - anybadge_server
  commands:
    - pip check
    - anybadge --help
    - anybadge-server --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/jongracecox/anybadge
  summary: Simple, flexible badge generator for project badges.
  license: MIT
  license_file:
    - LICENSE

extra:
  recipe-maintainers:
    - thewchan
